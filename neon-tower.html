<style>
/* Layout: one full-height stage, canvas fills it, HUD floats on top. Intro text sits above the tower, the game-over panel is centered. */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0a0918;
  --ink:#f2efff;
  --dim:#9b97c2;
  --accent:#ffd23f;
  --accent-ink:#1b1400;
  --cool:#3ee6ff;
  --hot:#ff4f9a;
  --panel:rgba(16,14,40,.84);
  --line:rgba(160,150,255,.22);
  --font-display:'Lalezar','Vazirmatn',Tahoma,system-ui,sans-serif;
  --font-body:'Vazirmatn',Tahoma,system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none}
.app{height:100%;display:flex;justify-content:center;background:var(--bg)}
.stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;border-inline:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;inset-inline:0;top:0;padding:14px 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none}
.best{justify-self:start;display:flex;flex-direction:column;gap:2px;padding-top:8px}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--dim)}
.best b{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score{font-family:var(--font-display);font-size:88px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(62,230,255,.45);transition:opacity .2s}
.is-over .score{opacity:0}
.bump{animation:bump .22s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.icon-btn{pointer-events:auto;justify-self:end;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:rgba(16,14,40,.55);color:var(--ink);cursor:pointer;margin-top:4px}
.icon-btn:focus-visible,.btn:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
.icon-btn .x{display:none}
.icon-btn.off .waves{display:none}
.icon-btn.off .x{display:inline}

.combo{position:absolute;inset-inline:0;top:104px;text-align:center;font-family:var(--font-display);font-size:30px;color:var(--accent);text-shadow:0 0 16px rgba(255,210,63,.55);pointer-events:none}
.combo.pulse{animation:bump .25s ease-out}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 20px;pointer-events:none}
#intro{justify-content:space-between;padding-top:132px;padding-bottom:max(26px,env(safe-area-inset-bottom,0px))}
.title-block{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:76px;line-height:1;text-shadow:-2px 0 var(--hot),2px 0 var(--cool),0 0 30px rgba(62,230,255,.35)}
.sub{margin:0;max-width:30ch;font-size:15px;line-height:1.8;color:var(--dim)}
.rules{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.7;color:var(--dim);max-width:34ch;text-align:start}
.rules b{color:var(--ink);font-weight:600}
.hint{font-weight:800;font-size:18px;color:var(--ink);animation:breathe 1.6s ease-in-out infinite}
.hint small{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--dim);text-align:center}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

#over{justify-content:center;background:rgba(6,5,20,.62)}
.panel{width:min(100%,340px);text-align:center;padding:26px 20px 22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:12px;align-items:center}
.panel h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.1}
.big{font-family:var(--font-display);font-size:96px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(62,230,255,.5)}
.unit{margin-top:-8px;font-size:13px;color:var(--dim)}
.msg{min-height:1.6em;margin:0;font-size:15px;font-weight:600;color:var(--accent)}
.rec{font-size:13px;color:var(--dim)}
.rec b{color:var(--ink);font-weight:600}
.btn{pointer-events:auto;display:inline-block;margin-top:6px;padding:14px 30px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--font-body);font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 0 28px rgba(255,210,63,.35)}
.tap{font-size:12px;color:var(--dim)}

@media (max-height:640px){
  #intro{padding-top:112px}
  h1{font-size:60px}
  .rules{display:none}
  .score{font-size:72px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<main class="app" dir="rtl" lang="fa">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="صحنه‌ی بازی"></canvas>

    <div class="hud">
      <div class="best"><span class="lbl">رکورد</span><b id="best">۰</b></div>
      <div class="score" id="score">۰</div>
      <button class="icon-btn" id="mute" type="button" aria-label="قطع و وصل صدا">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
          <g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
          <path class="x" d="M17 9l5 6M22 9l-5 6"/>
        </svg>
      </button>
    </div>
    <div class="combo" id="combo" role="status" hidden></div>

    <section class="screen" id="intro">
      <div class="title-block">
        <h1>برج نئون</h1>
        <p class="sub">بلوک‌ها رو دقیق روی هم بنداز. هر چی دقیق‌تر بزنی، برجت پهن‌تر می‌شه.</p>
        <ul class="rules">
          <li><b>دقیق بنداز</b> بلوک بدون برش می‌چسبه و کمبو می‌گیری.</li>
          <li><b>سه کمبو پشت‌هم</b> بلوک دوباره پهن می‌شه.</li>
          <li><b>هر طبقه تندتر</b> از قبلیه.</li>
        </ul>
      </div>
      <div class="hint">برای شروع بزن<small>لمس، کلیک یا کلید فاصله</small></div>
    </section>

    <section class="screen" id="over" hidden>
      <div class="panel">
        <h2>برج فروریخت</h2>
        <div class="big" id="finalScore">۰</div>
        <div class="unit">طبقه</div>
        <p class="msg" id="finalMsg"></p>
        <div class="rec">رکورد تو <b id="finalBest">۰</b></div>
        <button class="btn" id="again" type="button">یه دست دیگه</button>
        <div class="tap">یا هرجا بزن</div>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
  var scoreEl = $('score'), bestEl = $('best'), comboEl = $('combo');
  var intro = $('intro'), over = $('over'), muteBtn = $('mute');

  // Logical units: the game always sees a 420-wide world, canvas scales to fit.
  var LW = 420, BH = 30, BASEW = 210, TOL = 6;
  var scale = 1, LH = 800, dpr = 1;
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(n) { try { return Number(n).toLocaleString('fa-IR'); } catch (e) { return String(n); } }
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

  var best = parseInt(load('neonTower.best', '0'), 10) || 0;
  var muted = load('neonTower.mute', '0') === '1';

  var state = 'ready'; // ready | play | dead | over
  var stack, cur, score, combo, cam, camT, shake, bgHue, t = 0;
  var parts = [], rings = [], pieces = [], texts = [];
  var overAt = 0, overShown = 0, last = 0;

  var stars = [];
  for (var i = 0; i < 70; i++) {
    stars.push({ x: Math.random() * LW, y: Math.random() * 1400, z: 0.3 + Math.random() * 0.9, s: 0.8 + Math.random() * 1.6, f: 1 + Math.random() * 2, p: Math.random() * 6.28 });
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    scale = r.width / LW;
    LH = r.height / scale;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  function hueOf(l) { return (200 + l * 9) % 360; }
  function groundY() { return LH * 0.8; }

  // ---------- audio ----------
  var ac = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} } return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(f1, f2, dur, type, vol) {
    if (!ac || muted) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, n);
      if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, n + dur);
      g.gain.setValueAtTime(vol, n);
      g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(n); o.stop(n + dur + 0.03);
    } catch (e) {}
  }
  var PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  function sPlace() { tone(170, 60, 0.12, 'sine', 0.25); }
  function sPerfect(c) {
    var f = 523.25 * Math.pow(2, PENT[Math.min(c - 1, PENT.length - 1)] / 12);
    tone(f, f, 0.3, 'triangle', 0.18);
    tone(f * 2, f * 2, 0.2, 'sine', 0.06);
  }
  function sOver() { tone(320, 50, 0.55, 'sawtooth', 0.12); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function paintMute() {
    muteBtn.classList.toggle('off', muted);
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  paintMute();
  muteBtn.addEventListener('click', function () {
    muted = !muted; save('neonTower.mute', muted ? '1' : '0'); paintMute();
    if (!muted) { initAudio(); sPlace(); }
  });

  // ---------- game ----------
  function reset() {
    stack = [{ x: (LW - BASEW) / 2, w: BASEW, hue: hueOf(0) }];
    score = 0; combo = 0; cam = 0; camT = 0; shake = 0;
    bgHue = 200;
    parts = []; rings = []; pieces = []; texts = [];
    spawn(1);
    updateHud(false);
  }

  function spawn(dir) {
    var L = stack.length, top = stack[L - 1], w = top.w;
    var minX = -0.4 * w, maxX = LW - 0.6 * w;
    cur = { w: w, hue: hueOf(L), dir: dir, x: dir > 0 ? minX : maxX, minX: minX, maxX: maxX };
  }

  function speed() { return 150 + Math.min(score, 70) * 5; }

  function burst(x, wy, n, hue, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI;
      var s = (0.4 + Math.random()) * power;
      parts.push({ x: x, wy: wy, vx: Math.cos(a) * s * (Math.random() < 0.5 ? -1 : 1), vy: Math.sin(a) * s, life: 0, max: 0.45 + Math.random() * 0.35, hue: hue, size: 2 + Math.random() * 3 });
    }
  }

  function drop() {
    var L = stack.length, top = stack[L - 1];
    var left = Math.max(top.x, cur.x), right = Math.min(top.x + top.w, cur.x + cur.w);
    var ov = right - left;
    var wy = L * BH;

    if (ov <= 1) {
      pieces.push({ x: cur.x, w: cur.w, wy: wy, vy: 0, vx: cur.dir * 40, hue: cur.hue, rot: 0, vr: cur.dir * 0.9 });
      burst(cur.x + cur.w / 2, wy, 26, cur.hue, 220);
      die();
      return;
    }

    var nx, nw, perfect = false;
    if (Math.abs(cur.x - top.x) <= TOL) {
      perfect = true; combo++;
      nx = top.x; nw = top.w;
      if (combo >= 3 && nw < BASEW) {
        var grow = Math.min(5, BASEW - nw);
        nw += grow; nx -= grow / 2;
      }
    } else {
      combo = 0; nx = left; nw = ov;
      if (cur.x < top.x) {
        pieces.push({ x: cur.x, w: top.x - cur.x, wy: wy, vy: 0, vx: -35, hue: cur.hue, rot: 0, vr: -0.7 });
      } else {
        pieces.push({ x: top.x + top.w, w: cur.x + cur.w - (top.x + top.w), wy: wy, vy: 0, vx: 35, hue: cur.hue, rot: 0, vr: 0.7 });
      }
    }

    stack.push({ x: nx, w: nw, hue: cur.hue });
    score++;
    var topWy = (L + 1) * BH;
    sPlace();

    if (perfect) {
      sPerfect(combo);
      rings.push({ x: nx, w: nw, wy: topWy, life: 0, hue: cur.hue });
      burst(nx, topWy, 8, cur.hue, 170);
      burst(nx + nw, topWy, 8, cur.hue, 170);
      texts.push({ s: combo >= 2 ? 'دقیق ×' + fmt(combo) : 'دقیق!', x: Math.max(80, Math.min(LW - 80, nx + nw / 2)), wy: topWy + BH, life: 0, hue: cur.hue });
      buzz(12);
    } else {
      burst(nx + nw / 2, topWy, 5, cur.hue, 90);
    }

    spawn(-cur.dir);
    updateHud(true);
  }

  function die() {
    state = 'dead';
    shake = REDUCED ? 0 : 14;
    overAt = performance.now() + 850;
    cur = null;
    sOver(); buzz(80);
  }

  function showOver() {
    state = 'over';
    var prev = best;
    var isRecord = score > prev;
    if (isRecord) { best = score; save('neonTower.best', best); }
    $('finalScore').textContent = fmt(score);
    $('finalBest').textContent = fmt(best);
    var msg = '';
    if (isRecord) msg = prev === 0 ? 'اولین رکوردت ثبت شد!' : 'رکورد جدید!';
    else if (score === best && score > 0) msg = 'هم‌اندازه‌ی رکوردت شدی';
    else if (best > score) msg = fmt(best - score) + ' طبقه تا رکوردت مونده';
    else msg = 'یه بار دیگه امتحان کن';
    $('finalMsg').textContent = msg;
    over.hidden = false;
    stage.classList.add('is-over');
    overShown = performance.now();
    updateHud(false);
  }

  function startPlay() { state = 'play'; intro.hidden = true; }

  function restart() {
    reset();
    state = 'play';
    over.hidden = true;
    stage.classList.remove('is-over');
  }

  function updateHud(bump) {
    scoreEl.textContent = fmt(score);
    if (bump && !REDUCED) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
    bestEl.textContent = fmt(Math.max(best, score));
    if (combo >= 2) {
      comboEl.hidden = false;
      comboEl.textContent = 'کمبو ×' + fmt(combo);
      if (!REDUCED) { comboEl.classList.remove('pulse'); void comboEl.offsetWidth; comboEl.classList.add('pulse'); }
    } else {
      comboEl.hidden = true;
    }
  }

  function press() {
    initAudio();
    if (state === 'ready') { startPlay(); return; }
    if (state === 'play') { drop(); return; }
    if (state === 'over' && performance.now() - overShown > 450) { restart(); }
  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('#mute')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    press();
  });
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') {
      if (document.activeElement === muteBtn) return;
      e.preventDefault();
      press();
    }
  });

  // ---------- update ----------
  function update(dt) {
    if ((state === 'ready' || state === 'play') && cur) {
      cur.x += cur.dir * speed() * dt;
      if (cur.x > cur.maxX) { cur.x = cur.maxX; cur.dir = -1; }
      if (cur.x < cur.minX) { cur.x = cur.minX; cur.dir = 1; }
    }
    if (state === 'dead' && performance.now() > overAt) showOver();

    camT = Math.max(0, stack.length * BH - LH * 0.30);
    cam += (camT - cam) * Math.min(1, dt * 6);
    var bgT = 200 + stack.length * 9;
    bgHue += (bgT - bgHue) * Math.min(1, dt * 2);

    var i;
    for (i = pieces.length - 1; i >= 0; i--) {
      var p = pieces[i];
      p.vy -= 1400 * dt; p.wy += p.vy * dt; p.x += p.vx * dt; p.rot += p.vr * dt;
      if (groundY() - p.wy + cam > LH + 120) pieces.splice(i, 1);
    }
    for (i = parts.length - 1; i >= 0; i--) {
      var q = parts[i];
      q.life += dt; q.vy -= 600 * dt; q.wy += q.vy * dt; q.x += q.vx * dt;
      if (q.life > q.max) parts.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) { rings[i].life += dt; if (rings[i].life > 0.45) rings.splice(i, 1); }
    for (i = texts.length - 1; i >= 0; i--) { texts[i].life += dt; texts[i].wy += 40 * dt; if (texts[i].life > 0.9) texts.splice(i, 1); }
    shake *= Math.exp(-dt * 7);
    if (shake < 0.1) shake = 0;
  }

  // ---------- draw ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function block(x, sy, w, hue, glow, alpha) {
    var h = BH - 2, y = sy + 1;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    if (glow) { ctx.shadowColor = 'hsl(' + hue + ',100%,60%)'; ctx.shadowBlur = glow; }
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'hsl(' + hue + ',90%,66%)');
    g.addColorStop(1, 'hsl(' + hue + ',85%,46%)');
    ctx.fillStyle = g;
    rr(x, y, w, h, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'hsla(' + hue + ',100%,85%,.85)';
    ctx.fillRect(x + 3, y + 1.5, Math.max(0, w - 6), 2.5);
    ctx.restore();
  }

  function drawBg() {
    var h = ((bgHue % 360) + 360) % 360;
    var g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, 'hsl(' + h + ',55%,10%)');
    g.addColorStop(1, 'hsl(' + ((h + 50) % 360) + ',60%,4%)');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, LW + 40, LH + 40);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var y = (((s.y - cam * s.z * 0.25) % LH) + LH) % LH;
      ctx.globalAlpha = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.f + s.p));
      ctx.fillStyle = '#cfe9ff';
      ctx.fillRect(s.x, y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    var gy = groundY() + cam;
    if (gy > LH + 4) return;
    var g = ctx.createLinearGradient(0, gy, 0, LH);
    g.addColorStop(0, 'rgba(62,230,255,.16)');
    g.addColorStop(1, 'rgba(10,9,24,.9)');
    ctx.fillStyle = g;
    ctx.fillRect(-20, gy, LW + 40, LH - gy + 20);
    ctx.save();
    ctx.strokeStyle = 'rgba(62,230,255,.22)';
    ctx.lineWidth = 1;
    var k;
    for (k = -10; k <= 10; k++) {
      ctx.beginPath(); ctx.moveTo(LW / 2 + k * 22, gy); ctx.lineTo(LW / 2 + k * 110, gy + 400); ctx.stroke();
    }
    for (k = 1; k < 8; k++) {
      var yy = gy + Math.pow(k, 1.7) * 7;
      ctx.beginPath(); ctx.moveTo(-20, yy); ctx.lineTo(LW + 20, yy); ctx.stroke();
    }
    ctx.shadowColor = '#3ee6ff'; ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(62,230,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-20, gy); ctx.lineTo(LW + 20, gy); ctx.stroke();
    ctx.restore();
  }

  function drawMarkers() {
    var gy = groundY() + cam;
    ctx.save();
    ctx.font = '600 11px Vazirmatn, Tahoma, sans-serif';
    ctx.textBaseline = 'middle';
    var s;
    for (s = 10; s < 400; s += 10) {
      var sy = gy - (s + 1) * BH;
      if (sy < -20) break;
      if (sy > LH + 20) continue;
      ctx.strokeStyle = 'rgba(155,151,194,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(26, sy); ctx.stroke();
      ctx.fillStyle = 'rgba(155,151,194,.8)'; ctx.textAlign = 'left';
      ctx.fillText(fmt(s), 30, sy);
    }
    if (best > 0) {
      var ry = gy - (best + 1) * BH;
      if (ry > -20 && ry < LH + 20) {
        ctx.strokeStyle = 'rgba(255,210,63,.6)'; ctx.lineWidth = 1.5;
        ctx.setLineDash([8, 7]);
        ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(LW, ry); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,210,63,.95)'; ctx.textAlign = 'right';
        ctx.fillText('رکورد ' + fmt(best), LW - 10, ry - 9);
      }
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawGround();
    drawMarkers();

    var L = stack.length, gy = groundY();
    if (state === 'play' && cur) {
      var top = stack[L - 1], ty = gy - L * BH + cam;
      ctx.strokeStyle = 'hsla(' + top.hue + ',100%,70%,.10)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(top.x, ty); ctx.lineTo(top.x, -10);
      ctx.moveTo(top.x + top.w, ty); ctx.lineTo(top.x + top.w, -10);
      ctx.stroke();
    }

    var i, sy;
    for (i = 0; i < L; i++) {
      sy = gy - (i + 1) * BH + cam;
      if (sy > LH + BH || sy < -BH) continue;
      var b = stack[i];
      block(b.x, sy, b.w, b.hue, i === L - 1 ? 16 : 0);
    }

    for (i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      sy = gy - p.wy - BH + cam;
      ctx.save();
      ctx.translate(p.x + p.w / 2, sy + BH / 2);
      ctx.rotate(p.rot);
      block(-p.w / 2, -BH / 2, p.w, p.hue, 0, 0.9);
      ctx.restore();
    }

    if (cur && (state === 'play' || state === 'ready')) {
      sy = gy - (L + 1) * BH + cam;
      block(cur.x, sy, cur.w, cur.hue, 24);
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < parts.length; i++) {
      var q = parts[i], a = 1 - q.life / q.max;
      ctx.fillStyle = 'hsla(' + q.hue + ',100%,65%,' + a.toFixed(3) + ')';
      ctx.fillRect(q.x, gy - q.wy + cam, q.size, q.size);
    }
    for (i = 0; i < rings.length; i++) {
      var r = rings[i], k = r.life / 0.45, pad = k * 18;
      var ry = gy - r.wy + cam;
      ctx.strokeStyle = 'hsla(' + r.hue + ',100%,80%,' + (1 - k).toFixed(3) + ')';
      ctx.lineWidth = 2;
      rr(r.x - pad, ry + 1 - pad * 0.6, r.w + pad * 2, BH - 2 + pad * 1.2, 6 + pad * 0.3);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.font = '400 28px Lalezar, Vazirmatn, Tahoma, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < texts.length; i++) {
      var tx = texts[i], u = tx.life / 0.9;
      var pop = Math.min(1, tx.life / 0.12);
      var sc = 0.6 + 0.4 * pop;
      ctx.save();
      ctx.translate(tx.x, gy - tx.wy + cam);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.max(0, 1 - u * u);
      ctx.shadowColor = 'hsl(' + tx.hue + ',100%,60%)'; ctx.shadowBlur = 14;
      ctx.fillStyle = 'hsl(' + tx.hue + ',100%,82%)';
      ctx.fillText(tx.s, 0, 0);
      ctx.restore();
    }
    ctx.restore();

    ctx.restore();
  }

  function frame(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts; t += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(frame); });
})();
</script>

</body></html>
